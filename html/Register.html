<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/register.css" />
    <title>Register</title>
  </head>
  <body>
    <h1>Create Account</h1>
    <p>to get started now</p>

    <form>
      <input
        class="input-box"
        type="text"
        id="username"
        placeholder="Email or username"
        required
      />

      <div class="email-password-box">
        <input
          class="input-box"
          type="password"
          id="password"
          placeholder="Password"
        />

        <input
          class="input-box"
          type="password"
          id="confirm-password"
          placeholder="Confirm Password"
        />
      </div>

      <button class="sign-btn" type="submit">Sign Up</button>
      <p class="login-with">Or Login With</p>

      <div class="google-facebook">
        <button type="button" class="google-btn">
          <img src="/Google.png" alt="Google" />
        </button>

        <button type="button" class="facebook-btn">
          <img src="/Facebook.png" alt="Facebook" />
        </button>
      </div>
    </form>

    <div class="have-account-box">
      <p class="have-account">Already have account?</p>
      <a class="login-now" href="/html/log-in.html">Login Now</a>
    </div>
  </body>
</html>
